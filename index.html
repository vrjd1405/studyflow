const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const state={screen:db.introSeen?'home':'intro',introStep:0,selectedDate:localToday(),month:localToday().slice(0,7),category:null,filter:'All',analytics:'Overview',modal:null,edit:null,search:'',tab:'Tasks',calendarView:'Month', taskQuery:'', taskStatus:'All', taskSubject:'', taskPriority:'All', noteSubject:''};const $=s=>document.querySelector(s);const app=$('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Storage unavailable. Export a backup.')}};const tasks=()=>db.items.filter(x=>x.type==='task');const pct=(done,total)=>total?Math.round(100*done/total):0;const progress=cat=>{let a=tasks().filter(x=>!cat||x.categoryId===cat);return{done:a.filter(x=>x.done).length,total:a.length,p:pct(a.filter(x=>x.done).length,a.length)}};const color=p=>p>75?'#23df68':p>=50?'#ffcb29':'#ff4b55';const ring=(p,sz='')=>`<div class="ring ${sz}" style="--p:${p};--c:${color(p)}"><span>${p}%</span></div>`;const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});const fmtTime=t=>t?new Date('2026-01-01T'+t+':00').toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'Anytime';const cat=id=>db.categories.find(x=>x.id===id)||{name:'Uncategorized',emoji:'📁',color:'#ff3c4d'};const byDate=d=>db.items.filter(x=>x.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const active=x=>state.screen===x?'active':'';const nav=()=>`<nav class="bottom"><button class="navbtn ${active('home')}" onclick="go('home')">${icon('home')}Home</button><button class="navbtn ${active('calendar')}" onclick="go('calendar')">${icon('calendar')}Calendar</button><button class="fab" aria-label="Add task or event" onclick="openItem()">+</button><button class="navbtn ${active('subjects')||active('category')?'active':''}" onclick="go('subjects')">${icon('subjects')}Subjects</button><button class="navbtn ${active('profile')}" onclick="go('profile')">${icon('profile')}Profile</button></nav>`;

const taskrow=x=>`<div class="taskrow ${x.done?'done':''}" style="border-left-color:${x.done?'#21df69':x.type==='event'?'#a96df4':x.priority==='High'?'#ff4c55':'#e8bf31'}">${x.type==='task'?`<input class="check" aria-label="Mark ${esc(x.title)} completed" type="checkbox" ${x.done?'checked':''} data-id="${esc(x.id)}" onchange="toggle(this.dataset.id)">`:'<span style="font-size:20px">📅</span>'}<div class="taskinfo"><div class="tasktitle">${esc(x.title)}</div><div class="taskmeta">${fmtTime(x.time)} · ${esc(cat(x.categoryId).name)} ${x.type==='event'?'· Event':''} ${x.seriesId?'· Repeats':''}</div></div><button class="dots" aria-label="Edit ${esc(x.title)}" data-id="${esc(x.id)}" onclick="openItem(this.dataset.id)">⋮</button></div>`;

const clockText=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function focusTick(){if(!focus.running)return;focus.remaining=Math.max(0,Math.ceil((focus.deadline-Date.now())/1000));const display=document.getElementById('focus-display');if(display)display.textContent=clockText(focus.remaining);if(focus.remaining<=0){focus.running=false;clearInterval(focus.interval);if(focus.mode==='focus'){db.focusSessions=(Number(db.focusSessions)||0)+1;db.focusHistory=Array.isArray(db.focusHistory)?db.focusHistory:[];db.focusHistory.push({date:localToday(),minutes:focus.minutes});save()}toast(focus.mode==='focus'?'Focus session complete! Take a break.':'Break complete!');if(state.screen==='focus')render()}}

function dateOffset(date, offset) {
  const d=new Date(date+'T12:00:00');
  d.setDate(d.getDate()+offset);
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function moveCalendar(delta) {
  const date=state.selectedDate;
  if(state.calendarView==='Month'){
    const [y,m,day]=date.split('-').map(Number);
    const target=new Date(y,m-1+delta,1,12);
    const cap=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();
    const first=[target.getFullYear(),String(target.getMonth()+1).padStart(2,'0'),'01'].join('-');
    pickDate(dateOffset(first,Math.min(day,cap)-1));
  }else{
    pickDate(dateOffset(date,delta*(state.calendarView==='Week'?7:1)));
  }
}
function setCalendarView(view) {
  state.calendarView=view;
  render();
  document.querySelector('.calendar-views [aria-pressed="true"]')?.focus();
}
const calendar = () => {
  const date=state.selectedDate, view=state.calendarView, today=localToday();
  const first=view==='Month'?date.slice(0,7)+'-01':date;
  const start=dateOffset(first,-new Date(first+'T12:00:00').getDay());
  const end=dateOffset(start,6);
  const title=view==='Month'?new Date(first+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}):view==='Week'?`${fmtDate(start)} – ${fmtDate(end)}`:fmtDate(date);
  const entries=byDate(date);
  const grid=view==='Day'?'':`<div class="calgrid calendar-${view.toLowerCase()}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="weekday">${d}</div>`).join('')}${Array.from({length:view==='Week'?7:42},(_,i)=>{
    const key=dateOffset(start,i), items=byDate(key), limit=view==='Week'?5:2;
    return `<button type="button" class="cal-cell ${key===date?'selected':''} ${view==='Month'&&key.slice(0,7)!==date.slice(0,7)?'outside':''}" aria-pressed="${key===date}" ${key===today?'aria-current="date"':''} aria-label="${fmtDate(key)}, ${items.length} activities" onclick="pickDate('${key}')"><span class="cal-number">${Number(key.slice(-2))}</span>${items.slice(0,limit).map(x=>`<span class="cal-preview">${esc(x.title)}</span>`).join('')}${items.length>limit?`<span class="cal-preview">+${items.length-limit} more</span>`:''}${items.length?`<span class="cal-count">${items.length}</span>`:''}</button>`;
  }).join('')}</div>`;
  return `${header('Calendar')}<main class="page"><div class="page-heading"><h1>Calendar</h1><button class="primary" onclick="openItem()">＋ Add activity</button></div><div class="card"><div class="calendar-tools"><div><button class="iconbtn" aria-label="Previous ${view.toLowerCase()}" onclick="moveCalendar(-1)">‹</button><strong>${title}</strong><button class="iconbtn" aria-label="Next ${view.toLowerCase()}" onclick="moveCalendar(1)">›</button><button class="secondary today" onclick="pickDate(localToday())">Today</button></div><div class="pillrow calendar-views">${['Month','Week','Day'].map(v=>`<button class="pill ${view===v?'active':''}" aria-pressed="${view===v}" onclick="setCalendarView('${v}')">${v}</button>`).join('')}</div></div>${grid}</div><div class="sectionhead"><h2 id="selected-day" tabindex="-1">${fmtDate(date)}</h2><span class="sub">${entries.length} activities</span></div>${entries.map(taskrow).join('')||'<div class="empty">No activities on this day.</div>'}</main>`;
};
const subjectOptions = selected => db.categories.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
function taskResults() {
  const q=state.taskQuery.trim().toLowerCase();
  const items=db.items.filter(x=>{
    const status=state.taskStatus;
    if(status==='Events'&&x.type!=='event')return false;
    if(status==='Open'&&(x.type!=='task'||x.done))return false;
    if(status==='Completed'&&(x.type!=='task'||!x.done))return false;
    if(state.taskSubject&&state.taskSubject!==x.categoryId)return false;
    if(state.taskPriority!=='All'&&(x.type!=='task'||(x.priority||'Medium')!==state.taskPriority))return false;
    return [x.title,x.notes,cat(x.categoryId).name].some(value=>String(value??'').toLowerCase().includes(q));
  }).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  let date;
  return `<p class="sub" aria-live="polite">${items.length} activities</p>`+(items.map(x=>{
    const heading=date===x.date?'':`<h2 class="list-date">${fmtDate(x.date)}</h2>`;
    date=x.date;
    return heading+taskrow(x);
  }).join('')||'<div class="empty">No activities match these filters.</div>');
}
function filterTasks(key,value) {
  state[key]=value;
  document.querySelector('#task-results').innerHTML=taskResults();
}

ows="3" placeholder="Extra details">${esc(x?.notes||'')}</textarea><button class="primary full" style="margin-top:22px">${x?'Save Changes':'Create '+(type==='task'?'Task':'Event')}</button>${x?`<button class="outline-red" type="button" style="margin-top:9px" data-id="${esc(x.id)}" onclick="deleteItem(this.dataset.id)">Delete ${type}</button>${x.seriesId&&!x.done?'<button type="button" class="outline-red" onclick="removeFuture()">Delete this and later unfinished occurrences</button>':''}`:''}</form>`}
if(state.modal==='category'){body=`<form onsubmit="saveCategory(event)"><label class="formlabel">Category name *</label><input class="field" name="name" required maxlength="60" placeholder="e.g. Maths" value="${esc(c?.name||'')}"><div class="twocol"><div><label class="formlabel">Emoji</label><input class="field" name="emoji" maxlength="8" value="${esc(c?.emoji||'📚')}"></div><div><label class="formlabel">Accent color</label><input class="field" type="color" name="color" value="${esc(c?.color||'#f32b36')}"></div></div><label class="formlabel">Group</label><select class="field" name="group">${['Academic','Personal','Project'].map(g=>`<option ${c?.group===g?'selected':''}>${g}</option>`).join('')}</select><button class="primary full" style="margin-top:22px">${c?'Save Category':'Create Category'}</button>${c?`<button type="button" class="outline-red" style="margin-top:9px" data-id="${esc(c.id)}" onclick="deleteCategory(this.dataset.id)">Delete Category</button>`:''}</form>`}
if(state.modal==='note'){body=`<form onsubmit="saveNote(event)"><label class="formlabel">Subject<select class="field" name="categoryId"><option value="">General</option>${db.categories.map(k=>`<option value="${esc(k.id)}" ${k.id===(n?.categoryId??(state.screen==='category'?state.category:state.noteSubject))?'selected':''}>${esc(k.name)}</option>`).join('')}</select></label><label class="formlabel">Note title *</label><input class="field" name="title" required value="${esc(n?.title||'')}"><label class="formlabel">Content</label><textarea class="field" name="body" rows="6">${esc(n?.body||'')}</textarea><button class="primary full" style="margin-top:18px">Save Note</button>${n?`<button type="button" class="outline-red" style="margin-top:9px" data-id="${esc(n.id)}" onclick="deleteNote(this.dataset.id)">Delete Note</button>`:''}</form>`}
if(state.modal==='profile')body=`<form onsubmit="saveProfile(event)"><label class="formlabel">Display name</label><input class="field" name="username" maxlength="45" required value="${esc(db.username)}"><button class="primary full" style="margin-top:20px">Save Profile</button></form>`;
if(state.modal==='search')body=`<input class="field" id="searchbox" placeholder="Search tasks, events and categories" value="${esc(state.search)}" oninput="searchUpdate(this.value)"><div id="searchresults" style="margin-top:15px">${searchResults()}</div>`;
let modal=document.createElement('div');modal.className='modalback';modal.onclick=e=>{if(e.target===modal)closeModal()};modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${({item:state.edit?'Edit Activity':'Add Activity',category:state.edit?'Edit Category':'New Category',note:state.edit?'Edit Note':'New Note',profile:'Edit Profile',search:'Search'})[state.modal]}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div>${body}</div>`;document.body.append(modal)}
function setItemType(type){state.itemType=type;let form=document.querySelector('.modal form');if(form){state.draft=Object.fromEntries(new FormData(form));}renderModal();if(state.draft){let f=document.querySelector('.modal form');for(let [k,v] of Object.entries(state.draft)){if(f.elements[k])f.elements[k].value=v}state.draft=null}}
function deleteItem(id){if(!confirm('Delete this activity?'))return;db.items=db.items.filter(i=>i.id!==id);save();closeModal();render();toast('Activity deleted')}
function saveCategory(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(!o.name.trim())return;let c=state.edit?db.categories.find(x=>x.id===state.edit):null;if(c)Object.assign(c,o);else db.categories.push({...o,id:uid()});save();closeModal();render();toast('Category saved ✓')}
function deleteCategory(id){let count=db.items.filter(x=>x.categoryId===id).length;if(!confirm(`Delete category and its ${count} activities? This cannot be undone.`))return;db.categories=db.categories.filter(x=>x.id!==id);db.items=db.items.filter(x=>x.categoryId!==id);db.notes=db.notes.filter(x=>x.categoryId!==id);save();closeModal();go('subjects')}
function saveNote(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),n=state.edit?db.notes.find(x=>x.id===state.edit):null;if(n)Object.assign(n,o);else db.notes.push({...o,id:uid()});save();closeModal();render()}
function deleteNote(id){if(!confirm('Delete note?'))return;db.notes=db.notes.filter(x=>x.id!==id);save();closeModal();render()}
function saveProfile(e){e.preventDefault();db.username=e.target.username.value.trim();save();closeModal();render()}
function searchResults(){let q=state.search.trim().toLowerCase();if(!q)return '<div class="empty">Type to find an activity or category.</div>';let matches=db.items.filter(x=>x.title.toLowerCase().includes(q)||cat(x.categoryId).name.toLowerCase().includes(q));return matches.length?matches.slice(0,50).map(taskrow).join(''):'<div class="empty">No matches found.</div>'}function searchUpdate(s){state.search=s;$('#searchresults').innerHTML=searchResults()}
function exportData(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='studyflow-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup downloaded')}
async function importData(el){let f=el.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.categories)||!Array.isArray(d.items))throw Error('Invalid StudyFlow backup');if(!confirm('Restore this backup? It will replace your current tasks and categories.'))return;db={...d,notes:Array.isArray(d.notes)?d.notes:[],username:d.username||'StudyFlow User',introSeen:true,focusSessions:Number(d.focusSessions)||0};save();go('home');toast('Backup restored ✓')}catch(e){toast('Invalid backup file')}}function confirmReset(){if(!confirm('Reset to original 14 sample tasks? Your current data will be replaced. Export a backup first.'))return;db={categories:structuredClone(seedCats),items:structuredClone(seedTasks),notes:[],username:db.username,introSeen:true,scheduleShiftNov24:true};save();go('home')}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.modal) closeModal();
});
render();
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline setup unavailable',err)));
}
</script></body></html>
