const focusDuration=()=>focus.mode==='break'?300:focus.minutes*60;
const clockText=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function focusTick(){if(!focus.running)return;focus.remaining=Math.max(0,Math.ceil((focus.deadline-Date.now())/1000));const display=document.getElementById('focus-display');if(display)display.textContent=clockText(focus.remaining);if(focus.remaining<=0){focus.running=false;clearInterval(focus.interval);if(focus.mode==='focus'){db.focusSessions=(db.focusSessions||0)+1;save()}toast(focus.mode==='focus'?'Focus session complete! Take a break.':'Break complete!');if(state.screen==='focus')render()}}
function focusStart(){if(focus.running)return;focus.deadline=Date.now()+focus.remaining*1000;focus.running=true;clearInterval(focus.interval);focus.interval=setInterval(focusTick,250);render()}
function focusPause(){focusTick();focus.running=false;clearInterval(focus.interval);render()}
function focusReset(){focus.running=false;clearInterval(focus.interval);focus.remaining=focusDuration();render()}
function focusMode(m){focus.running=false;clearInterval(focus.interval);focus.mode=m;focus.remaining=focusDuration();render()}
function focusMinutes(n){focus.minutes=n;focusReset()}
const focusPage=()=>`${header('Focus Timer')}<main class="page"><h1>Focus Zone ⚔️</h1><div class="sub">One task. One mission. No distractions.</div><div class="focusbox"><div class="center"><div class="pillrow" style="justify-content:center"><button class="pill ${focus.mode==='focus'?'active':''}" onclick="focusMode('focus')">Focus</button><button class="pill ${focus.mode==='break'?'active':''}" onclick="focusMode('break')">5-min Break</button></div><div id="focus-display" class="focusclock">${clockText(focus.remaining)}</div><div class="sectionnote">${focus.mode==='focus'?'Deep work session':'Rest and recharge'}</div></div><div class="focusactions" style="margin-top:24px"><button class="primary" onclick="${focus.running?'focusPause()':'focusStart()'}">${focus.running?'Pause':'Start'}</button><button class="secondary" onclick="focusReset()">Reset</button></div></div><div class="sectionhead"><h2>Session length</h2></div><div class="pillrow">${[15,25,45,60].map(n=>`<button class="pill ${focus.minutes===n?'active':''}" onclick="focusMinutes(${n})">${n} min</button>`).join('')}</div><div class="card" style="margin-top:22px"><b>🏆 ${(db.focusSessions||0)} completed focus sessions</b><p class="sectionnote">Sessions count when the timer finishes. Keep the page open; background browser restrictions may delay the alert.</p></div><button class="outline-red" onclick="go('home')">← Back to Dashboard</button></main>`;
const upcomingPage=()=>{let today=localToday(),a=db.items.filter(x=>x.date>=today&&(x.type==='event'||!x.done)).sort((x,y)=>x.date.localeCompare(y.date)||(x.time||'').localeCompare(y.time||'')),overdue=tasks().filter(x=>!x.done&&x.date<today).sort((x,y)=>x.date.localeCompare(y.date));return `${header('My Schedule')}<main class="page"><h1>Mission Schedule 🗓️</h1><div class="sub">Your upcoming tasks and events, sorted by date.</div><div class="sectionhead"><h2>Upcoming (${a.length})</h2></div>${a.length?a.map(x=>`<div class="sectionnote" style="margin:14px 0 5px">${fmtDate(x.date)} · ${fmtTime(x.time)}</div>${taskrow(x)}`).join(''):'<div class="empty">No upcoming activities yet.</div>'}<div class="sectionhead"><h2>Overdue (${overdue.length})</h2></div>${overdue.length?overdue.map(x=>`<div class="sectionnote" style="margin:14px 0 5px">${fmtDate(x.date)}</div>${taskrow(x)}`).join(''):'<div class="empty">No overdue tasks. Keep it up!</div>'}<button class="outline-red" onclick="openItem()">＋ Add Activity</button></main>`};
const home=()=>{const p=progress(),pending=tasks().filter(x=>!x.done).length;return `${header()}<main class="page"><div class="heroimg"></div><h1>${new Date().getHours()<12?'Good morning':'Ready to focus'}! 👋</h1><div class="sub">Let your warrior wake up. Make today count.</div><div class="stats"><div class="stat"><b>${db.items.length}</b><span>Planned activities</span></div><div class="stat"><b>${p.p}%</b><span>Overall progress</span></div><div class="stat"><b>${pending}</b><span>Tasks remaining</span></div></div><div class="quicktools"><button class="quicktool" onclick="go('focus')"><span style="font-size:25px">⏱️</span><strong>Focus Zone</strong><small>Pomodoro timer · 15–60 min</small></button><button class="quicktool" onclick="go('upcoming')"><span style="font-size:25px">🗓️</span><strong>My Schedule</strong><small>Upcoming & overdue work</small></button></div><div class="sectionhead"><h2>Subject Progress</h2><button class="link" onclick="go('subjects')">View All ›</button></div><div class="catgrid">${db.categories.slice(0,5).map(c=>`<button class="catbox" onclick="openCategory('${c.id}')">${ring(progress(c.id).p)}<small>${esc(c.name)}</small></button>`).join('')}<button class="catbox" onclick="openCategoryForm()"><div class="ring"><span style="font-size:32px">+</span></div><small>Add Category</small></button></div><div class="sectionhead"><h2>Today's Plan</h2><button class="link" onclick="go('calendar')">${fmtDate(localToday())} ›</button></div>${byDate(localToday()).length?byDate(localToday()).map(taskrow).join(''):'<div class="empty">Nothing planned for this date. Add your first task!</div>'}<button class="outline-red" onclick="openItem()">＋ Add a task or event</button></main>`};
const calendar=()=>{let [y,m]=state.month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();let cells=Array.from({length:42},(_,i)=>{let d=i-first+1,real=d>=1&&d<=days,date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return `<button class="day ${real?'':'muted'} ${date===state.selectedDate?'selected':''} ${real&&byDate(date).length?'has':''}" ${real?`onclick="pickDate('${date}')"`:'disabled'}>${real?d:''}</button>`}).join('');return `${header('Calendar')}<main class="page"><h1>Calendar</h1><div class="card"><div class="calhead"><button class="iconbtn" onclick="changeMonth(-1)">‹</button><strong>${new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</strong><button class="iconbtn" onclick="changeMonth(1)">›</button></div><div class="calgrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells}</div></div><div class="sectionhead"><h2>${fmtDate(state.selectedDate)}</h2><span class="sub">${byDate(state.selectedDate).length} activities</span></div>${byDate(state.selectedDate).length?byDate(state.selectedDate).map(taskrow).join(''):'<div class="empty">No activities on this day.</div>'}<button class="primary full" onclick="openItem()">＋ Add Activity</button></main>`};
const subjects=()=>{let cats=db.categories.filter(c=>state.filter==='All'||c.group===state.filter);return `${header('Subjects')}<main class="page"><h1>Subjects & Categories</h1><div class="sub">Your goals, organized your way.</div><div class="pillrow">${['All','Academic','Personal','Project'].map(f=>`<button class="pill ${state.filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div>${cats.map(c=>{let p=progress(c.id);return `<button class="categoryrow" onclick="openCategory('${c.id}')"><span class="emoji" style="background:${c.color}20;border-color:${c.color}55">${esc(c.emoji)}</span><span class="grow"><strong>${esc(c.name)}</strong><small>${p.done} / ${p.total} tasks completed · ${esc(c.group)}</small></span>${ring(p.p,'sm')}</button>`}).join('')||'<div class="empty">No categories here yet.</div>'}<button class="outline-red" onclick="openCategoryForm()">＋ Add Category</button></main>`};
const categoryPage=()=>{let c=cat(state.category),p=progress(state.category),a=db.items.filter(x=>x.categoryId===state.category&&x.type===state.tab.slice(0,-1).toLowerCase());if(state.tab==='Notes')a=[];return `${header('Category')}<main class="page"><div class="headingback"><button class="iconbtn" onclick="go('subjects')">←</button><h1>${esc(c.emoji)} ${esc(c.name)}</h1><button class="iconbtn" style="margin-left:auto" onclick="openCategoryForm('${c.id}')">✎</button></div><div class="card"><div style="display:flex;align-items:center;gap:16px">${ring(p.p)}<div><b>${p.done} of ${p.total}</b><div class="sub">tasks completed</div></div></div><div class="progressline" style="margin-top:15px"><div style="width:${p.p}%;background:${color(p.p)}"></div></div></div><div class="pillrow">${['Tasks','Events','Notes'].map(t=>`<button class="pill ${state.tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</div>${state.tab==='Notes'?db.notes.filter(n=>n.categoryId===state.category).map(n=>`<div class="note"><strong>${esc(n.title)}</strong><p class="sub">${esc(n.body)}</p><button class="link" onclick="openNote('${n.id}')">Edit</button></div>`).join('')||'<div class="empty">No notes yet.</div>':a.map(taskrow).join('')||`<div class="empty">No ${state.tab.toLowerCase()} yet.</div>`}<button class="primary full" onclick="${state.tab==='Notes'?'openNote()':`openItem(null,'${state.tab==='Events'?'event':'task'}')`}">＋ Add ${state.tab==='Notes'?'Note':state.tab==='Events'?'Event':'Task'}</button></main>`};
const analytics=()=>{let p=progress();return `${header('Progress')}<main class="page"><h1>Progress & Analytics</h1><div class="pillrow">${['Overview','Subject Wise'].map(x=>`<button class="pill ${state.analytics===x?'active':''}" onclick="setAnalytics('${x}')">${x}</button>`).join('')}</div><div class="card center" style="padding:27px 15px">${ring(p.p,'big')}<div style="margin-top:12px;font-size:13px">Overall Completion</div><div class="sub">${p.done} / ${p.total} tasks</div></div><div class="stats"><div class="stat"><b style="color:#27dd6a">${p.done}</b><span>Completed</span></div><div class="stat"><b>${p.total-p.done}</b><span>Pending</span></div><div class="stat"><b>${db.items.filter(x=>x.type==='event').length}</b><span>Events</span></div></div><div class="sectionhead"><h2>Subject-wise Progress</h2></div>${db.categories.map(c=>{let q=progress(c.id);return `<div style="display:flex;gap:12px;align-items:center;margin:17px 0"><div style="width:125px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div><div class="progressline" style="flex:1"><div style="width:${q.p}%;background:${color(q.p)}"></div></div><strong style="width:35px;text-align:right;font-size:12px">${q.p}%</strong></div>`}).join('')}<div class="sub" style="margin-top:20px">Green &gt;75% · Yellow 50–75% · Red &lt;50%. Categories with no tasks show 0%.</div></main>`};

ter;font-size:42px">⚔️</div><h1>${esc(db.username)}</h1><div class="sub">Plan · Track · Focus · Achieve</div></div><button class="setting" onclick="openProfile()">✎ &nbsp; Edit profile <span>›</span></button><button class="setting" onclick="go('analytics')">◉ &nbsp; Progress & Analytics <span>›</span></button><button class="setting" onclick="exportData()">⇩ &nbsp; Export JSON backup <span>›</span></button><button class="setting" onclick="$('#importfile').click()">⇧ &nbsp; Restore JSON backup <span>›</span></button><button class="setting" onclick="showIntro()">⚔ &nbsp; Replay Warrior Intro <span>›</span></button><button class="setting" onclick="confirmReset()">↺ &nbsp; Reset sample data <span>›</span></button><input id="importfile" type="file" accept=".json,application/json" hidden onchange="importData(this)"><p class="sub" style="line-height:1.6;margin-top:24px">Your data is stored in this browser on this device. Export backups regularly. Opening this HTML through a different browser or file location may use separate storage.</p></main>`;
const intro=()=>`<div class="intro"><div><div class="introbrand">⌛ Study<em>Flow</em></div><div style="font-size:11px;letter-spacing:3px;margin-top:10px">PLAN · TRACK · FOCUS · ACHIEVE</div></div><div><div class="sub" style="letter-spacing:4px;color:white">LET YOUR</div><h1><em>WARRIOR</em><br>WAKE UP</h1><p>Turn discipline into progress and progress into success.</p></div><div style="width:100%"><button class="primary" onclick="introSkip()">Begin Your Journey →</button></div></div>`;
function render(){app.innerHTML=state.screen==='intro'?intro():`<div class="shell">${({home,calendar,subjects,category:categoryPage,analytics,profile,focus:focusPage,upcoming:upcomingPage})[state.screen]?.()||home()}${nav()}</div>`;if(state.modal)renderModal();}function go(s){if(s==='calendar'&&state.screen==='home'){state.selectedDate=localToday();state.month=localToday().slice(0,7)}state.screen=s;state.modal=null;render();scrollTo(0,0)}function introNext(){introSkip()}function introSkip(){db.introSeen=true;save();go('home')}function showIntro(){go('intro')}function setFilter(f){state.filter=f;render()}function setTab(t){state.tab=t;render()}function setAnalytics(t){state.analytics=t;render()}function openCategory(id){state.category=id;state.tab='Tasks';go('category')}function pickDate(d){state.selectedDate=d;render()}function changeMonth(delta){let [y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+delta,1);state.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}function toggle(id){let x=db.items.find(x=>x.id===id);if(x&&x.type==='task'){x.done=!x.done;save();render()}}
function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3200)}
function openItem(id=null,type='task'){state.modal='item';state.edit=id;state.itemType=id?(db.items.find(x=>x.id===id)?.type||type):type;renderModal()}function openCategoryForm(id=null){state.modal='category';state.edit=id;renderModal()}function openNote(id=null){state.modal='note';state.edit=id;renderModal()}function openProfile(){state.modal='profile';renderModal()}function openSearch(){state.modal='search';renderModal()}function closeModal(){state.modal=null;document.querySelector('.modalback')?.remove()}
function renderModal(){document.querySelector('.modalback')?.remove();let x=state.edit?db.items.find(i=>i.id===state.edit):null,c=state.edit?db.categories.find(i=>i.id===state.edit):null,n=state.edit?db.notes.find(i=>i.id===state.edit):null;let body='';if(state.modal==='item'){let type=state.itemType;body=`<form onsubmit="saveItem(event)"><label class="formlabel">Title *</label><input class="field" name="title" required maxlength="160" placeholder="What are you planning?" value="${esc(x?.title||'')}"><label class="formlabel">Category *</label><select class="field" name="categoryId" required>${db.categories.map(k=>`<option value="${esc(k.id)}" ${k.id===(x?.categoryId||state.category)?'selected':''}>${esc(k.emoji)} ${esc(k.name)}</option>`).join('')}</select><label class="formlabel">Type</label><div class="seg"><button type="button" class="${type==='task'?'primary':'secondary'}" onclick="setItemType('task')">☑ Task</button><button type="button" class="${type==='event'?'primary':'secondary'}" onclick="setItemType('event')">◷ Event</button></div><div class="twocol"><div><label class="formlabel">Date *</label><input class="field" name="date" type="date" required value="${esc(x?.date||state.selectedDate)}"></div><div><label class="formlabel">Time</label><input class="field" name="time" type="time" value="${esc(x?.time||'')}" ></div></div>${type==='task'?`<label class="formlabel">Priority</label><select class="field" name="priority">${['Low','Medium','High'].map(p=>`<option ${x?.priority===p?'selected':''}>${p}</option>`).join('')}</select>`:''}<label class="formlabel">Notes (optional)</label><textarea class="field" name="notes" rows="3" placeholder="Extra details">${esc(x?.notes||'')}</textarea><button class="primary full" style="margin-top:22px">${x?'Save Changes':'Create '+(type==='task'?'Task':'Event')}</button>${x?`<button class="outline-red" type="button" style="margin-top:9px" onclick="deleteItem('${x.id}')">Delete ${type}</button>`:''}</form>`}
if(state.modal==='category'){body=`<form onsubmit="saveCategory(event)"><label class="formlabel">Category name *</label><input class="field" name="name" required maxlength="60" placeholder="e.g. Maths" value="${esc(c?.name||'')}"><div class="twocol"><div><label class="formlabel">Emoji</label><input class="field" name="emoji" maxlength="8" value="${esc(c?.emoji||'📚')}"></div><div><label class="formlabel">Accent color</label><input class="field" type="color" name="color" value="${esc(c?.color||'#f32b36')}"></div></div><label class="formlabel">Group</label><select class="field" name="group">${['Academic','Personal','Project'].map(g=>`<option ${c?.group===g?'selected':''}>${g}</option>`).join('')}</select><button class="primary full" style="margin-top:22px">${c?'Save Category':'Create Category'}</button>${c?`<button type="button" class="outline-red" style="margin-top:9px" onclick="deleteCategory('${c.id}')">Delete Category</button>`:''}</form>`}
if(state.modal==='note'){body=`<form onsubmit="saveNote(event)"><label class="formlabel">Note title *</label><input class="field" name="title" required value="${esc(n?.title||'')}"><label class="formlabel">Content</label><textarea class="field" name="body" rows="6">${esc(n?.body||'')}</textarea><button class="primary full" style="margin-top:18px">Save Note</button>${n?`<button type="button" class="outline-red" style="margin-top:9px" onclick="deleteNote('${n.id}')">Delete Note</button>`:''}</form>`}
if(state.modal==='profile')body=`<form onsubmit="saveProfile(event)"><label class="formlabel">Display name</label><input class="field" name="username" maxlength="45" required value="${esc(db.username)}"><button class="primary full" style="margin-top:20px">Save Profile</button></form>`;
if(state.modal==='search')body=`<input class="field" id="searchbox" placeholder="Search tasks, events and categories" value="${esc(state.search)}" oninput="searchUpdate(this.value)"><div id="searchresults" style="margin-top:15px">${searchResults()}</div>`;
let modal=document.createElement('div');modal.className='modalback';modal.onclick=e=>{if(e.target===modal)closeModal()};modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${({item:state.edit?'Edit Activity':'Add Activity',category:state.edit?'Edit Category':'New Category',note:state.edit?'Edit Note':'New Note',profile:'Edit Profile',search:'Search'})[state.modal]}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div>${body}</div>`;document.body.append(modal)}
function setItemType(type){state.itemType=type;let form=document.querySelector('.modal form');if(form){state.draft=Object.fromEntries(new FormData(form));}renderModal();if(state.draft){let f=document.querySelector('.modal form');for(let [k,v] of Object.entries(state.draft)){if(f.elements[k])f.elements[k].value=v}state.draft=null}}
function saveItem(e){e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f));if(!o.title.trim()||!o.categoryId||!o.date)return toast('Please complete required fields');let x=state.edit?db.items.find(i=>i.id===state.edit):null;if(x)Object.assign(x,o,{type:state.itemType});else db.items.push({...o,id:uid(),type:state.itemType,done:false});save();closeModal();render();toast('Activity saved ✓')}
function deleteItem(id){if(!confirm('Delete this activity?'))return;db.items=db.items.filter(i=>i.id!==id);save();closeModal();render();toast('Activity deleted')}
function saveCategory(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(!o.name.trim())return;let c=state.edit?db.categories.find(x=>x.id===state.edit):null;if(c)Object.assign(c,o);else db.categories.push({...o,id:uid()});save();closeModal();render();toast('Category saved ✓')}
function deleteCategory(id){let count=db.items.filter(x=>x.categoryId===id).length;if(!confirm(`Delete category and its ${count} activities? This cannot be undone.`))return;db.categories=db.categories.filter(x=>x.id!==id);db.items=db.items.filter(x=>x.categoryId!==id);db.notes=db.notes.filter(x=>x.categoryId!==id);save();closeModal();go('subjects')}
function saveNote(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),n=state.edit?db.notes.find(x=>x.id===state.edit):null;if(n)Object.assign(n,o);else db.notes.push({...o,id:uid(),categoryId:state.category});save();closeModal();render()}
function deleteNote(id){if(!confirm('Delete note?'))return;db.notes=db.notes.filter(x=>x.id!==id);save();closeModal();render()}
function saveProfile(e){e.preventDefault();db.username=e.target.username.value.trim();save();closeModal();render()}
function searchResults(){let q=state.search.trim().toLowerCase();if(!q)return '<div class="empty">Type to find an activity or category.</div>';let matches=db.items.filter(x=>x.title.toLowerCase().includes(q)||cat(x.categoryId).name.toLowerCase().includes(q));return matches.length?matches.slice(0,50).map(taskrow).join(''):'<div class="empty">No matches found.</div>'}function searchUpdate(s){state.search=s;$('#searchresults').innerHTML=searchResults()}
function exportData(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='studyflow-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup downloaded')}
